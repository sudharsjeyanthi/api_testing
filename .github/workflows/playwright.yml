name: Regression test

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Choose browser to run tests'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
      env:
        description: 'Choose environment to run tests'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
      testtype:
        description: 'Choose test-type to run tests'
        required: true
        default: 'regression'
        type: choice
        options:
          - regression

# Required permissions to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Allure Commandline Tool
        run: npm install -D allure-commandline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Sanity tests
        run: npx playwright test --grep "@sanity"
        env:
          BROWSER: ${{ github.event.inputs.browser }}
          TEST_TYPE: 'sanity'
        continue-on-error: true

      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      # Upload the generated report as an artifact for GitHub Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    # Grant deploy permissions
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
